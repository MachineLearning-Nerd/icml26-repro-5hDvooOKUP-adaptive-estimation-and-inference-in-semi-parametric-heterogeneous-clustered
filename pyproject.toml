[project]
name = "adaptive-orthogonal-mtl-repro"
version = "0.1.0"
description = "Faithful reproduction of 'Adaptive Estimation and Inference in Semi-parametric Heterogeneous Clustered Multitask Learning via Neyman Orthogonality' (arXiv 2605.01907, OpenReview 5hDvooOKUP)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "lightgbm>=4.3",
    "joblib>=1.4",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "huggingface-hub>=0.24",
]

[tool.uv]
package = false
